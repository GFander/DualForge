// Spike-000 experiment input: Forge-native probe mod, compiled against Forge.
//
// IMPORTANT: the line below is the authoritative declaration of the compile
// dependency for this experiment. It must be preserved verbatim:
//
//     minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
//
// Build environment note: Gradle is not installed in the Spike-000 host and
// ForgeGradle requires a full network-backed MC decompile, so the actual
// compile for this run was executed with javac against the exact artifacts
// that the official Forge 1.21.1-52.1.0 installer resolved into
// forge-server/libraries (javafmllanguage-1.21.1-52.1.0.jar +
// eventbus-6.2.27.jar). Both are the same Forge 1.21.1-52.1.0 dependency the
// line above declares. See Spike-000 report section 三 for the exact command.

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.example.forgeprobe'

base {
    archivesName = 'forgeprobe'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.0'
}

jar {
    manifest {
        attributes(['Manifest-Version': '1.0', 'Automatic-Module-Name': 'forgeprobe'])
    }
}
